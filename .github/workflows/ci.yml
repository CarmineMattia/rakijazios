name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Same pin as scripts/ci-test.sh: the app image Host-001 runs.
  RAKAZO_APP_IMAGE: ghcr.io/elie222/rakazo/app@sha256:1a70f06cf3c7a3f5c7f53e15b62f3c0709b81520ed40e671a1acb2ffcc40654c

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Runner tests, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Shell sandbox prerequisites (bubblewrap + unprivileged user namespaces)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all --die-with-parent true
      - name: Pull app image
        run: docker pull "$RAKAZO_APP_IMAGE"
      - name: Checks
        env:
          # The sandbox tests must run (not skip) in CI.
          RAKAZO_TEST_REQUIRE_SANDBOX: "1"
        run: scripts/ci-test.sh
      - name: Boot smoke (api + migrations + patch DDL on a throwaway PostgreSQL)
        run: scripts/ci-boot.sh
