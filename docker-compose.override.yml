# Let api/worker reach host Ollama via host.docker.internal (Linux Docker).
# SELinux: supervisor must talk to the host docker.sock to spawn bot computers.
# computer: local image with PCManFM in the Fluxbox menu.
# RAKAZO_HOST_HOME: host folder bind-mounted into bots at /mnt/local when
# Settings → Computer → Allow local access is on (default off).
# Use ~/rakazo-local (not $HOME) so uid 1000 inside bot computers can read it.
services:
  computer:
    image: rakazo/computer:pcmanfm
    build:
      context: ./computer
      dockerfile: Dockerfile
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAKAZO_HOST_HOME: ${HOME}/rakazo-local
      # Rakijazios M1 shared-local: worker -> api gateway -> owner runner.
      RAKAZO_SHARED_LOCAL_GATEWAY_URL: http://api:3100/api/local-runners/v1
      RAKAZO_SHARED_LOCAL_MODELS: gemma4:26b-a4b-it-q4_K_M
      # Rakijazios M2a: Settings → My hardware, pairing codes and runner installers.
      RAKAZO_LOCAL_RUNNERS_UI: "1"
    volumes:
      - ./patches/api/model-selection.ts:/app/packages/adapters/src/model-selection.ts:ro,z
      - ./patches/api/executor.ts:/app/packages/adapters/src/executor.ts:ro,z
      - ./patches/api/docker-sandbox.ts:/app/packages/adapters/src/docker-sandbox.ts:ro,z
      - ./patches/api/host-aware-sandbox.ts:/app/packages/adapters/src/host-aware-sandbox.ts:ro,z
      - ./patches/api/router.ts:/app/apps/api/src/router.ts:ro,z
      - ./patches/api/app.ts:/app/apps/api/src/app.ts:ro,z
      - ./patches/api/social.ts:/app/apps/api/src/social.ts:ro,z
      - ./patches/api/group-access.ts:/app/apps/api/src/group-access.ts:ro,z
      - ./patches/api/group-sharing.ts:/app/apps/api/src/group-sharing.ts:ro,z
      - ./patches/api/thread-target.ts:/app/apps/api/src/thread-target.ts:ro,z
      - ./patches/api/space-invites.ts:/app/apps/api/src/space-invites.ts:ro,z
      - ./patches/api/computer-settings.ts:/app/apps/api/src/computer-settings.ts:ro,z
      - ./patches/api/computer-status.ts:/app/apps/api/src/computer-status.ts:ro,z
      - ./patches/contracts/rpc.ts:/app/packages/contracts/src/rpc.ts:ro,z
      - ./patches/contracts/domain.ts:/app/packages/contracts/src/domain.ts:ro,z
      - ./patches/auth/index.ts:/app/packages/auth/src/index.ts:ro,z
      - ./patches/api/index.ts:/app/apps/api/src/index.ts:ro,z
      - ./patches/api/local-runners.ts:/app/apps/api/src/local-runners.ts:ro,z
      - ./patches/api/local-runner-control.ts:/app/apps/api/src/local-runner-control.ts:ro,z
      - ./patches/api/local-runner-pairing.ts:/app/apps/api/src/local-runner-pairing.ts:ro,z
      - ./patches/api/local-runner-install.ts:/app/apps/api/src/local-runner-install.ts:ro,z
      # Runner files served (pinned, checksummed) by the installers.
      - ./runner:/app/apps/api/local-runner-bundle:ro,z
      - ./patches/api/rpc-errors.ts:/app/apps/api/src/rpc-errors.ts:ro,z
      - ./patches/api/group-message-summary.ts:/app/apps/api/src/group-message-summary.ts:ro,z
      - ./patches/api/local-runner-seed.ts:/app/apps/api/src/local-runner-seed.ts:ro,z
      - ./patches/api/shared-local-token.ts:/app/apps/api/src/shared-local-token.ts:ro,z
      - ./patches/api/shared-local-token.ts:/app/packages/adapters/src/shared-local-token.ts:ro,z
      - ./patches/api/pi-local-provider.ts:/app/packages/adapters/src/pi-local-provider.ts:ro,z
      - ./patches/api/pi-models.ts:/app/packages/adapters/src/pi-models.ts:ro,z
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAKAZO_HOST_HOME: ${HOME}/rakazo-local
      # Rakijazios M1 shared-local: worker -> api gateway -> owner runner.
      RAKAZO_SHARED_LOCAL_GATEWAY_URL: http://api:3100/api/local-runners/v1
      RAKAZO_SHARED_LOCAL_MODELS: gemma4:26b-a4b-it-q4_K_M
    volumes:
      - ./patches/api/model-selection.ts:/app/packages/adapters/src/model-selection.ts:ro,z
      - ./patches/api/executor.ts:/app/packages/adapters/src/executor.ts:ro,z
      - ./patches/api/docker-sandbox.ts:/app/packages/adapters/src/docker-sandbox.ts:ro,z
      - ./patches/api/host-aware-sandbox.ts:/app/packages/adapters/src/host-aware-sandbox.ts:ro,z
      - ./patches/auth/index.ts:/app/packages/auth/src/index.ts:ro,z
      - ./patches/api/shared-local-token.ts:/app/packages/adapters/src/shared-local-token.ts:ro,z
      - ./patches/api/pi-local-provider.ts:/app/packages/adapters/src/pi-local-provider.ts:ro,z
      - ./patches/api/pi-models.ts:/app/packages/adapters/src/pi-models.ts:ro,z
  web:
    volumes:
      - ./patches/web/dist:/app/apps/web/dist:ro,z
      # Rakijazios M2a: proxy the runner WebSocket through the web origin.
      - ./patches/web/vite.config.ts:/app/apps/web/vite.config.ts:ro,z
  supervisor:
    security_opt:
      - label:disable
    group_add:
      - "963"
    environment:
      RAKAZO_COMPUTER_IMAGE: rakazo/computer:pcmanfm
      RAKAZO_HOST_HOME: ${HOME}/rakazo-local
    volumes:
      - ./patches/supervisor/index.ts:/app/infra/sandboxes/supervisor/src/index.ts:ro,z
