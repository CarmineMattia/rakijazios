org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Public https host the app opens (no scheme, no path). Override per build:
#   gradle -p android/twa assembleDebug -PtwaHost=rakijazios.<your-domain>
# or set RAKIJAZIOS_TWA_HOST. The placeholder below builds, but the app only
# runs full-screen once https://<host>/.well-known/assetlinks.json matches the
# signing key (see docs/android-app.md).
twaHost=rakijazios.example.com
